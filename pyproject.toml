[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ds-llm-eval"
version = "0.0.1"
description = "Unified, pip-installable evaluation toolkit for search, recommendation, and LLM/agentic pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "prjha-ds", email = "prashantjha.ds@gmail.com" }]
keywords = ["evaluation", "information-retrieval", "recommender-systems", "llm", "ragas", "langfuse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
search = ["scikit-learn>=1.3"]
recommendation = ["scikit-learn>=1.3", "scipy>=1.10"]
llm = ["ragas>=0.2", "langfuse>=2.0"]
all = ["ds-llm-eval[search,recommendation,llm]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/prjha-ds/ds-llm-eval"
Repository = "https://github.com/prjha-ds/ds-llm-eval"
Issues = "https://github.com/prjha-ds/ds-llm-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_llm_eval"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --import-mode=importlib --cov=ds_llm_eval --cov-report=term-missing"
markers = ["integration: tests that hit live external services (skipped by default in CI)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
