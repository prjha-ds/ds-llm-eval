[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ds-llm-eval"
version = "0.1.0"
description = "Unified, pip-installable evaluation toolkit for search, recommendation, and LLM/agentic pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "prjha-ds", email = "prashantjha.ds@gmail.com" }]
keywords = ["evaluation", "information-retrieval", "recommender-systems", "llm", "ragas", "langfuse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
search = ["scikit-learn>=1.3"]
recommendation = ["scikit-learn>=1.3", "scipy>=1.10"]
llm = ["ragas>=0.2", "langfuse>=3.0", "jsonschema>=4.0"]
backends = ["ranx>=0.3", "pytrec-eval-terrier>=0.5"]
all = ["ds-llm-eval[search,recommendation,llm,backends]"]
# Benchmark adapters (roadmap) — heavy/sandbox deps, installed only on demand.
benchmarks-search = ["beir>=2.0", "mteb>=1.0"]
benchmarks-knowledge = ["lm-eval>=0.4"]
benchmarks-code = ["bigcodebench"]
benchmarks-swe = ["swebench>=2.0"]
benchmarks-agents = ["tau-bench"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
    "types-pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/prjha-ds/ds-llm-eval"
Repository = "https://github.com/prjha-ds/ds-llm-eval"
Issues = "https://github.com/prjha-ds/ds-llm-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_llm_eval"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --import-mode=importlib --cov=ds_llm_eval --cov-report=term-missing"
markers = ["integration: tests that hit live external services (skipped by default in CI)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# Allow mathematical unicode (Σ, ², ≥, ×, →, ⊆) in docstrings/comments — metric formulas.
ignore = ["RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# Optional / untyped third-party backends — imported lazily, no stubs required.
[[tool.mypy.overrides]]
module = [
    "pandas", "pandas.*", "numpy.*", "jsonschema", "jsonschema.*",
    "ranx", "ranx.*", "pytrec_eval", "lm_eval", "lm_eval.*",
    "swebench", "swebench.*", "ragas", "ragas.*", "datasets", "datasets.*",
    "langfuse", "langfuse.*",
]
ignore_missing_imports = true
