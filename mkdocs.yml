site_name: ds-llm-eval
site_description: Unified evaluation for search, recommendation, and LLM/agentic pipelines
repo_url: https://github.com/prjha-ds/ds-llm-eval
docs_dir: docs

# Build: pip install -e ".[docs]" && python scripts/gen_reference.py && mkdocs build --strict
# Serve: mkdocs serve   (reference.md is generated by scripts/gen_reference.py, git-ignored)

# The working handoff is not part of the published site.
exclude_docs: |
  handoff.md

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Roadmap: plan.md
  - Research survey: research.md
  - Metric reference: reference.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
